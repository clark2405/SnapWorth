name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Frontend

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      # Use the npm version pinned in package.json#packageManager, not the runner's default.
      # Newer npm reads this lockfile's optional peer dependencies differently and rejects it.
      - name: Use pinned npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      # Topology, exact dependency pins, static safety checks, typecheck, lint, unit and property tests.
      - name: Validate
        run: npm run validate

      - name: Check formatting
        run: npm run format:check

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [web, mobile]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      # Use the npm version pinned in package.json#packageManager, not the runner's default.
      # Newer npm reads this lockfile's optional peer dependencies differently and rejects it.
      - name: Use pinned npm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: npm ci

      # web: production Expo web export. mobile: iOS and Android JavaScript bundles, which catch
      # native-only bundling errors without needing Xcode or Android Studio.
      - name: Build ${{ matrix.target }}
        run: npm run build:${{ matrix.target }}

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Migrations, row-level security, and the seed against a throwaway Postgres (the runner
      # image ships the server binaries) with a stand-in for Supabase's auth schema.
      - name: Database tests
        run: scripts/test-db.sh

      # Typecheck the Edge Functions and run their unit tests.
      - name: Edge Function tests
        run: scripts/test-functions.sh
