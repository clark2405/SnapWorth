# Supabase CLI configuration. Only the settings SnapWorth relies on are listed; everything else
# uses the CLI defaults. See Backend/README.md for setup.
project_id = "snapworth"

[db.seed]
enabled = true
sql_paths = ["./seed/*.sql"]

[auth]
# Lets the app comment before full sign-in exists: each device gets an anonymous account with
# its own profile. Turn off once email sign-in is wired up.
enable_anonymous_sign_ins = true

[functions.moderate-content]
verify_jwt = true

[functions.estimate-price]
# The handler validates the bearer session with Supabase Auth itself. This also
# supports clients using the newer publishable project keys.
verify_jwt = false

[functions.delete-account]
# As for estimate-price: the handler checks the caller's session with Supabase Auth itself.
verify_jwt = false

[functions.worthy-chat]
# As for estimate-price: the handler checks the caller's session with Supabase Auth itself.
verify_jwt = false

[functions.moderate-comment]
enabled = true
verify_jwt = false
import_map = "./functions/moderate-comment/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/moderate-comment/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/moderate-comment/*.html" ]
